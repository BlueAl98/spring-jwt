spring.application.name=security

spring.datasource.url=jdbc:mariadb://localhost:3308/securitydb
spring.datasource.username=najib
spring.datasource.password=secret
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ========================
# = JPA / HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Opcional: configurar el dialecto de Hibernate para MariaDB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Clave for token security
security.key=somescretkeyforencriptyourinformation
